
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlowCart - Shopping App</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #fdf2ff, #e5edff);
    min-height: 100vh;
    color: #25213b;
}

header {
    background: linear-gradient(135deg, #7c3aed, #ec4899);
    color: white;
    padding: 25px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    box-shadow: 0 5px 20px #7c3aed30;
}

.logo {
    font-size: 27px;
    font-weight: bold;
}

.cart {
    background: #ffffff30;
    border: 1px solid #ffffff60;
    padding: 12px 18px;
    border-radius: 30px;
    font-weight: bold;
}

.hero {
    text-align: center;
    padding: 45px 20px 30px;
}

.hero h1 {
    font-size: clamp(30px, 5vw, 45px);
    margin-bottom: 12px;
}

.hero h1 span {
    color: #9333ea;
}

.hero p {
    color: #6b6480;
    margin-bottom: 25px;
}

.search {
    width: min(90%, 450px);
    padding: 14px 20px;
    border: 1px solid #e4d7ff;
    border-radius: 30px;
    outline: none;
    font-size: 15px;
    background: white;
}

.search:focus {
    border-color: #9333ea;
    box-shadow: 0 0 0 3px #9333ea20;
}

.section-title {
    padding: 15px 7%;
    font-size: 24px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 22px;
    padding: 15px 7% 45px;
}

.product {
    background: #ffffffd9;
    border: 1px solid #ffffff;
    border-radius: 22px;
    padding: 16px;
    box-shadow: 0 8px 25px #51408012;
    transition: transform .25s, box-shadow .25s;
}

.product:hover {
    transform: translateY(-6px);
    box-shadow: 0 15px 30px #51408025;
}

.product-img {
    height: 160px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 75px;
    background: linear-gradient(135deg, #ede9fe, #fce7f3);
    margin-bottom: 17px;
}

.product h3 {
    font-size: 18px;
    margin-bottom: 8px;
}

.description {
    color: #89839b;
    font-size: 13px;
    margin-bottom: 14px;
}

.price-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}

.price {
    font-size: 20px;
    font-weight: bold;
    color: #7c3aed;
}

.add-btn {
    border: none;
    padding: 11px 14px;
    border-radius: 12px;
    background: linear-gradient(135deg, #7c3aed, #ec4899);
    color: white;
    cursor: pointer;
    font-weight: bold;
    transition: opacity .2s;
}

.add-btn:hover {
    opacity: .8;
}

.cart-section {
    margin: 0 7% 40px;
    padding: 24px;
    border-radius: 22px;
    background: white;
    box-shadow: 0 8px 25px #51408012;
}

.cart-section h2 {
    margin-bottom: 15px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid #eee8fa;
}

.remove-btn {
    border: none;
    color: #e11d48;
    background: #fff1f2;
    padding: 7px 10px;
    border-radius: 8px;
    cursor: pointer;
}

.total {
    text-align: right;
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
    color: #7c3aed;
}

.empty {
    color: #89839b;
    padding: 10px 0;
}

footer {
    text-align: center;
    padding: 25px;
    color: #77708d;
}

@media (max-width: 480px) {
    header {
        padding: 20px;
    }

    .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        padding: 12px;
        gap: 12px;
    }

    .product {
        padding: 10px;
        border-radius: 16px;
    }

    .product-img {
        height: 115px;
        font-size: 55px;
    }

    .price-row {
        align-items: flex-start;
        flex-direction: column;
    }

    .add-btn {
        width: 100%;
    }

    .section-title {
        padding: 15px;
    }

    .cart-section {
        margin: 10px 12px 30px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">✨ GlowCart</div>
    <div class="cart">
        🛒 Cart (<span id="cart-count">0</span>)
    </div>
</header>

<section class="hero">
    <h1>Find Your <span>Perfect Style</span></h1>
    <p>Discover amazing products at amazing prices.</p>
    <input
        class="search"
        type="search"
        id="search"
        placeholder="🔍 Search products..."
        aria-label="Search products"
    >
</section>

<h2 class="section-title">🔥 Trending Products</h2>

<div class="products" id="products"></div>

<section class="cart-section" id="cart">
    <h2>🛍️ Your Shopping Cart</h2>
    <div id="cart-items">
        <p class="empty">Your cart is empty. Start shopping!</p>
    </div>
    <div class="total">
        Total: ₹<span id="total">0</span>
    </div>
</section>

<footer>
    Made with 💜 by GlowCart | Happy Shopping!
</footer>

<script>
const products = [
    {
        id: 1,
        name: "Wireless Headphones",
        price: 1499,
        emoji: "🎧",
        description: "Premium sound quality"
    },
    {
        id: 2,
        name: "Smart Watch",
        price: 2299,
        emoji: "⌚",
        description: "Style meets technology"
    },
    {
        id: 3,
        name: "Sneakers",
        price: 1799,
        emoji: "👟",
        description: "Comfort for every step"
    },
    {
        id: 4,
        name: "Backpack",
        price: 999,
        emoji: "🎒",
        description: "Your everyday companion"
    },
    {
        id: 5,
        name: "Sunglasses",
        price: 699,
        emoji: "🕶️",
        description: "Look cool everywhere"
    },
    {
        id: 6,
        name: "Camera",
        price: 4999,
        emoji: "📸",
        description: "Capture every moment"
    }
];

let cart = [];

const productContainer = document.getElementById("products");
const cartItems = document.getElementById("cart-items");

function renderProducts(list) {
    productContainer.innerHTML = "";

    if (list.length === 0) {
        productContainer.innerHTML =
            '<p class="empty">No products found.</p>';
        return;
    }

    list.forEach(product => {
        const card = document.createElement("article");
        card.className = "product";

        const image = document.createElement("div");
        image.className = "product-img";
        image.textContent = product.emoji;

        const name = document.createElement("h3");
        name.textContent = product.name;

        const description = document.createElement("p");
        description.className = "description";
        description.textContent = product.description;

        const row = document.createElement("div");
        row.className = "price-row";

        const price = document.createElement("span");
        price.className = "price";
        price.textContent = "₹" + product.price.toLocaleString("en-IN");

        const button = document.createElement("button");
        button.className = "add-btn";
        button.textContent = "Add +";
        button.addEventListener("click", () => addToCart(product.id));

        row.append(price, button);
        card.append(image, name, description, row);
        productContainer.appendChild(card);
    });
}

function addToCart(id) {
    const product = products.find(item => item.id === id);
    const existing = cart.find(item => item.id === id);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({ ...product, quantity: 1 });
    }

    renderCart();
}

function changeQuantity(id, amount) {
    const item = cart.find(item => item.id === id);
    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {
        cart = cart.filter(item => item.id !== id);
    }

    renderCart();
}

function renderCart() {
    const count = cart.reduce((sum, item) => sum + item.quantity, 0);

    const total = cart.reduce(
        (sum, item) => sum + item.price * item.quantity, 0
    );

    document.getElementById("cart-count").textContent = count;
    document.getElementById("total").textContent =
        total.toLocaleString("en-IN");

    cartItems.innerHTML = "";

    if (cart.length === 0) {
        cartItems.innerHTML =
            '<p class="empty">Your cart is empty. Start shopping!</p>';
        return;
    }

    cart.forEach(item => {
        const row = document.createElement("div");
        row.className = "cart-item";

        const details = document.createElement("span");
        details.textContent =
            `${item.emoji} ${item.name} × ${item.quantity}`;

        const subtotal = document.createElement("strong");
        subtotal.textContent =
            "₹" + (item.price * item.quantity).toLocaleString("en-IN");

        const actions = document.createElement("div");
        actions.style.display = "flex";
        actions.style.alignItems = "center";
        actions.style.gap = "6px";

        const minus = document.createElement("button");
        minus.className = "remove-btn";
        minus.textContent = "−";
        minus.setAttribute("aria-label", "Decrease quantity");
        minus.addEventListener("click", () => changeQuantity(item.id, -1));

        const plus = document.createElement("button");
        plus.className = "remove-btn";
        plus.textContent = "+";
        plus.setAttribute("aria-label", "Increase quantity");
        plus.addEventListener("click", () => changeQuantity(item.id, 1));

        actions.append(minus, plus, subtotal);
        row.append(details, actions);
        cartItems.appendChild(row);
    });
}

document.getElementById("search").addEventListener("input", event => {
    const query = event.target.value.toLowerCase().trim();

    const filtered = products.filter(product =>
        product.name.toLowerCase().includes(query) ||
        product.description.toLowerCase().includes(query)
    );

    renderProducts(filtered);
});

renderProducts(products);
renderCart();
</script>

</body>
</html>
